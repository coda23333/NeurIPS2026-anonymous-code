seed: 42
device: cuda
num_workers: 4
batch_size: 32
epochs: 200
save_every: 10
mixed_precision: true

optimizer:
  name: adamw
  lr: 0.0002
  weight_decay: 0.0001

scheduler:
  name: cosine
  warmup_epochs: 10
  min_lr: 1.0e-6

model:
  proj_dim: 256
  token_dim: 128
  token_grid: [4, 4]
  use_hstf: true
  hstf_stage_flags: [true, true, true, true]
  use_temporal_mhsa_dfs: true
  use_local_attn_cir: true

loss:
  temperature: 0.07
  use_global_contrast: true
  use_stage_contrast: true
  use_phy_consistency: true
  lambda_stage: 0.5
  lambda_phy: 0.2
  stage_weights: [0.1, 0.2, 0.3, 0.4]

preprocess:
  dfs_log: true
  cir_abs: true
  cir_log: true
  normalize: per_sample_zscore
  eps: 1.0e-6
